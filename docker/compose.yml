name: rasprec-nvr

# Only the nvr service publishes a port, and it binds to loopback. Reach it
# remotely over Tailscale on this host -- never forward these ports on a router.

x-nvr-image: &nvr-image
  build:
    context: .
    dockerfile: Dockerfile
  image: rasprec-nvr:latest

services:
  # One-shot: turns cameras.yml into mediamtx.yml, then exits.
  nvr-config:
    <<: *nvr-image
    command: ["-m", "nvr.render_config"]
    env_file: [.env]
    volumes:
      - ./config:/config:ro
      - mtxconfig:/mtxconfig
      - ${DATA_DIR:-./data}/recordings:/recordings
    restart: "no"

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    command: ["/mtxconfig/mediamtx.yml"]
    volumes:
      - mtxconfig:/mtxconfig:ro
      - ${DATA_DIR:-./data}/recordings:/recordings
    restart: unless-stopped
    depends_on:
      nvr-config:
        condition: service_completed_successfully

  nvr:
    <<: *nvr-image
    env_file: [.env]
    environment:
      MEDIAMTX_HOST: mediamtx
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
    depends_on:
      - mediamtx

volumes:
  mtxconfig:
