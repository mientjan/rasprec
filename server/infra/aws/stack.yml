AWSTemplateFormatVersion: '2010-09-09'
Description: RaspRec single-server recorder; no credentials or automatic media formatting.
Parameters:
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m6i.large, m6i.xlarge]
  UbuntuImage:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DataSize:
    Type: Number
    Default: 250
    MinValue: 100
    MaxValue: 16000
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional alert destination; never put secrets here.
Conditions:
  Burstable: !Or [!Equals [!Ref InstanceType, t3.large], !Equals [!Ref InstanceType, t3.xlarge]]
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.76.0.0/16, EnableDnsSupport: true, EnableDnsHostnames: true}
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Gateway}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.76.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  Route:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway}
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and TLS-only camera ingest; administration through SSM
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 1936, ToPort: 1936, CidrIp: 0.0.0.0/0}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref Role]}
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: Route
    Properties:
      ImageId: !Ref UbuntuImage
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      CreditSpecification: !If [Burstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 30, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: rasprec-recorder}]
  PublicIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  PublicIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties: {AllocationId: !GetAtt PublicIp.AllocationId, InstanceId: !Ref Instance}
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Encrypted: true
      Size: !Ref DataSize
      VolumeType: gp3
      Tags: [{Key: Name, Value: rasprec-data}]
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {InstanceId: !Ref Instance, VolumeId: !Ref DataVolume, Device: /dev/sdf}
  Alerts:
    Type: AWS::SNS::Topic
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: {TopicArn: !Ref Alerts, Protocol: email, Endpoint: !Ref AlertEmail}
  StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref Alerts]
  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: RaspRec
      MetricName: disk_used_percent
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
Outputs:
  InstanceId: {Value: !Ref Instance}
  PublicIp: {Value: !Ref PublicIp}
  DataVolumeId: {Value: !Ref DataVolume}
  AlertTopicArn: {Value: !Ref Alerts}
