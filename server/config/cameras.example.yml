# Copy to cameras.yml and edit. Passwords go in .env and are referenced as
# ${VAR} so this file stays safe to share.

retention:
  continuous: 24h   # how long the 24/7 archive is kept
  clips_days: 7    # how long motion clips are kept
  segment: 10m      # length of each archive file

# Applied to every camera; override per camera under its own `motion:` key.
motion:
  sensitivity: 25   # per-pixel difference threshold, 0-255. Lower = touchier.
  min_area: 0.4     # % of the frame that must change
  max_duration: 5m  # split sustained motion; max 1h
  cooldown: 15s     # quiet time before an event is closed
  pre_roll: 5s      # seconds of archive kept before the trigger
  post_roll: 10s    # ...and after it

cameras:
  # A rasprec Pi. Single 1080p stream, so detection reads the main stream.
  - name: garage
    url: rtsp://view:${GARAGE_PASS}@garage-pi:8554/cam

  # An off-the-shelf camera. Record the main stream, detect on the low-res
  # substream -- much cheaper to decode, especially for 4K or H.265.
  - name: driveway
    url: rtsp://admin:${DRIVEWAY_PASS}@192.168.1.40:554/Preview_01_main
    sub_url: rtsp://admin:${DRIVEWAY_PASS}@192.168.1.40:554/Preview_01_sub
    motion:
      min_area: 1.0
      # Ignore the road along the top of the frame: [x, y, w, h] in % .
      mask:
        - [0, 0, 100, 20]
